name: Deploy

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push-to-ecr:
    name: Build and push to ECR
    needs: [test]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: ${{ github.repository }}/ajna-api
          platforms: linux/amd64

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        env:
          REPOSITORY: ajna-api
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:production-${{ github.sha }}

  deploy:
    needs: [test, build-and-push-to-ecr]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      ECS_CLUSTER: maker-cluster
      IMAGE_TAG: production-${{ github.sha }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ecs-deploy-1.17.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy new api version
        run: uv tool run --with 'certifi>=2026.10.19' --from ecs-deploy==1.17.0 ecs deploy "$ECS_CLUSTER" ajna-api --tag "$IMAGE_TAG" --timeout -1

      - name: Deploy new celery beat version
        run: uv tool run --with 'certifi>=2026.10.19' --from ecs-deploy==1.17.0 ecs deploy "$ECS_CLUSTER" ajna-celery-beat --tag "$IMAGE_TAG" --timeout -1

      - name: Deploy new celery worker version
        run: uv tool run --with 'certifi>=2026.10.19' --from ecs-deploy==1.17.0 ecs deploy "$ECS_CLUSTER" ajna-celery-worker --tag "$IMAGE_TAG" --timeout -1
