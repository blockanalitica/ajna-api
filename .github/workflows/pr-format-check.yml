name: Pull request format check

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]
    branches:
      - main

jobs:
  check-pull-request:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      pull-requests: read

    steps:
      - name: Pull Request - Title verification
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            revert
            perf
            test
            build
            ci
            deps
            chore
          subjectPattern: '^[A-Za-z].*[^.]$'
          subjectPatternError: 'Pull request title "{title}" must start its subject with a letter and must not end with a dot.'

      - name: Pull Request - Title length validation
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if (( ${#PR_TITLE} > 80 )); then
            echo "::error::Pull request title must not exceed 80 characters."
            exit 1
          fi
