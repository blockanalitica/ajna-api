name: "setup-uv-env"
description: "Install the locked dependencies needed by a CI job."

inputs:
  dependency-group:
    description: "Dependencies to install: lint or test."
    required: false
    default: "test"
  save-cache:
    description: "Whether to save the uv cache after the job."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.9"
        enable-cache: true
        save-cache: ${{ inputs.save-cache }}
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        cache-suffix: ${{ inputs.dependency-group }}

    - name: Install dependencies
      env:
        DEPENDENCY_GROUP: ${{ inputs.dependency-group }}
      run: |
        case "$DEPENDENCY_GROUP" in
          lint) uv sync --locked --only-group lint ;;
          test) uv sync --locked --no-default-groups --group test --no-install-project ;;
          *) echo "::error::Unknown dependency group: $DEPENDENCY_GROUP"; exit 1 ;;
        esac
      shell: bash
