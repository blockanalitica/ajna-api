repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format --force-exclude --check
        language: system
        types: [python]
        require_serial: true
