[project]
name = "ajna-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery[redis]>=5.6.3,<5.7",
    "chain-harvester==3.3.0",
    "discord-webhook>=1.4.1,<2",
    "django>=6.0.10,<7",
    "django-bulk-load>=1.4.3,<2",
    "django-celery-beat>=2.9.0,<3",
    "django-cors-headers>=4.9.0,<5",
    "django-debug-toolbar>=8.0.0,<9",
    "django-environ>=0.14.0,<0.15",
    "django-extensions>=4.1,<5",
    "django-model-utils>=5.0.0,<6",
    "django-redis>=7.0.0,<8",
    "djangorestframework>=3.18.3,<4",
    "eth-abi>=5.2.0,<6",
    "eth-typing>=6.0.0,<7",
    "gunicorn>=27.0.1,<28",
    "hexbytes>=2.0.0,<3",
    "hiredis>=3.5.0,<4",
    "ijson>=3.6.0,<4",
    "ipython>=9.18.1,<10",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg2>=2.9.13,<3",
    "pyopenssl>=26.4.0,<27",
    "redis>=6.4.0,<6.5",
    "requests>=2.34.2,<3",
    "sentry-sdk==2.75.0",
    "web3>=7.16.0,<8",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit==4.7.0",
    "werkzeug==3.1.9",
]
lint = [
    "ruff==0.17.5",
]
test = [
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-mock==3.17.0",
    "pytest-sugar==1.1.1",
    "responses==0.26.3",
]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, chain-harvester = false }
constraint-dependencies = ["kombu<5.7"]

[tool.pytest.ini_options]
addopts = "--ds=config.settings.test --no-migrations --capture=no --verbose"
pythonpath = [
  "ajna"
]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-exclude = [
  "*/migrations/*.py"
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
extend-select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-print
    "T20",
    # flake8-simplify
    "SIM",
    # flake8-pie
    "PIE",
    # flake8-commas
    "COM",
    # flake8-pyi
    "PYI",
    # flake8-pytest-style
    "PT",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
    # pep8-naming
    "N",
    # Perflint
    "PERF"
]
ignore = [
    "C901",
    "COM812",
    "E731",
    "PERF401",
    "PYI024",
    "RUF012",
    "S108",
    "S608",
    "SIM108",
    "TRY002",
    "TRY003",
    "TRY300",
    "S105"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ajna"]
